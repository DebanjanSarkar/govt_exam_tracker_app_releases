name: govt_exam_tracker_app
description: "A local-first, smart tracker for Indian Government Exams."
publish_to: 'none'
version: 2.1.0+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  google_fonts: ^6.2.1

  # State Management
  flutter_riverpod: ^2.5.1

  # Local Database & Storage
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3
  uuid: ^4.4.0

  # URL Launcher (for opening exam portals)
  url_launcher: ^6.3.0

  # Google Auth & Google Drive Sync
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  http: ^1.2.1

  # Local Notifications & Timezone
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.3

  # PDF & File Picking (Ready for AI module)
  file_picker: ^8.0.3

  # For parsing PDF:
  google_generative_ai: ^0.4.6
  syncfusion_flutter_pdf: ^24.2.9

  # For universal clock cooldown flutter_state_management
  shared_preferences: ^2.3.2

  # For checking package version number
  package_info_plus: ^8.0.2

  # Excel Generation & File Sharing
  excel: ^4.0.3
  share_plus: ^9.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # For icon generation
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

# Setting the path of logo image
flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21